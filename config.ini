[Configuration]

# VCF file, bgzip-compressed and tabix-indexed
vcf = 

# Tab-separated text file with phenotypes
# Sample names in column 1, trait names in row 1
# If you do not wish to provide phenotypes, keep this file name intact!
phe = .tsv

# GFF annotation file, bgzip-compressed and tabix-indexed
ann = 

# Genome sequence FASTA file, uncompressed and tabix-indexed
seq = 

# Bam files, comma + space (, ) separated
bam = 

# Tab-separated text file with gene expression matrix
# Run IDs in row 1, gene IDs in column 1
exp = 

# Tab-separated text file with gene expression run info
# Run IDs in column 1, project IDs in column 2, column headers in row 1
# Required if "exp" is specified
runs = 

# Tab-separated text file with gene expression project info
# Project IDs in column 1, column headers in row 1
# Optional
proj = 

# Tab-separated text file with alternative/human-readable sample names
# Sample IDs in column 1, sample names in column 2
samp = 

# Tab-separated text file with additional gene information
# Gene IDs in column 1, column headers in row 1
gene_info = 

# Columns in gene_info to allow the calculation of enrichment from
# Comma + space (, ) separated
enr_cols = 

# Path to save GFFutils databases to
gff_db = res/gffutils_db/


### Parameters

# Allow users to delete a marker set along with all association analysis results 
# Leave blank to disable, set to True to enable
rm_markers = 

# Allow users to upload more phenotype data via a text file
# Leave blank to disable, set to True to enable
phe_upload = 

# Visibility window (in bp) for IGV.js tracks
vis_win = 1000000

# Height of IGV.js tracks
height = 150

# With a large number of chromosomes (e.g. unplaced scaffolds all separately),
# visualisation will likely fail. In such case, specify chromosomes to label,
# remaining will be grouped under "Other"
# Comma + space (, ) separated
# The remaining scaffolds should come after the visible ones
chr_vis = 