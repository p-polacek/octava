{% extends "header.html" %}
{% block title %} Locus analysis {% endblock %}
{% block style %}{% endblock %}
{% block errors %}{% endblock %}{% block content %}
  <div class="results-wrapper">
    <div
     id="igv-div"
     class="results-container margin-top">
    </div>
  </div>
{% endblock %}
{% block script %}
  <script
   src="https://code.jquery.com/jquery-3.6.4.min.js">
  </script>
  <script
   src="https://cdn.jsdelivr.net/npm/igv@2.15.5/dist/igv.min.js">
  </script>

  <script type="module">
    var genome  = '{{ genome }}';
    var markers = '{{ markers }}';
    var model   = '{{ model }}';
    var optHash = '{{ opt_hash }}';
    const igvConfig = {{ igv_conf|tojson|safe }};
    var igvDiv = document.getElementById("igv-div");
    const browser = await igv.createBrowser(igvDiv, igvConfig);
    browser.on("trackclick", function (track, popoverData) {
      if (popoverData.length > 0) {
        var ch = popoverData[0].value;
        var pos = popoverData[1].value;
        const trackToAccess = browser.trackViews
          .map(trackView => trackView.track)
          .find(track => track?.name == "LD");
        browser.removeTrack(trackToAccess);
        $.get('/ld/'
              + optHash + '/'
              + genome + '/'
              + model + '/'
              + markers + '/'
              + ch + '/'
              + pos, function(outHash) {
          const LDTrack = {
            name: "LD",
            type: "gwas",
            format: "gwas",
            posteriorProbability: "true",
            url: "/ld_file/" + outHash,
            visibilityWindow: '{{ vis_win }}',
            height: '{{ height }}',
            columns: {
              chromosome: 1,
              position: 2,
              value: 3
            },
            min: -0.1,
            max: 1.1,
            dotSize: 3,
            }
          browser.loadTrack(LDTrack);
        });
      }
    });
  </script>
{% endblock %}
