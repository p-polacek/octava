{% extends "header.html" %}

{% block title %} Random forest optimization {% endblock %}

{% block style %}{% endblock %}

{% block content %}
  <div class="results-wrapper">
    <div class="row-div">
      <h2 class="padded-left">
        Results:
      </h2>
    </div>
    <div class="results-container padded-top">
      <div class="disp-flex">
        <div class="scrollable results-subcontainer flex">
          <div
           id="optim-plot"
           class="results-subcontainer">
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}

{% block script %}
  <script>
    var [mtryVals, ntreeVals, rfData] = {{ rf_data|tojson }};
    var traces = [];
    for (let i = 0; i < mtryVals.length; i++) {
      var trace = {
        x: ntreeVals,
        y: rfData.map(v => v[i]),
        mode: "lines",
        name: mtryVals[i],
      };
      traces.push(trace);
    }

    var layout = {
      yaxis: {
        title: "Proportion of variance explained",
        range: [0, 1],
      },
      xaxis: {
        title: "ntree",
      },
      legend: {
        title: {
          text: "mtry",
        },
      },
      margin: {
        l: 80,
        r: 40,
        b: 50,
        t: 70,
        pad: 4
      },
    };

    // Render the plot
    Plotly.newPlot("optim-plot", traces, layout);
  </script>
{% endblock %}
