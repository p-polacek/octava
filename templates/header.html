<!DOCTYPE html>
<html lang="en">
	<head>
		<title> HS -{% block title %} {% endblock %} </title>
		<link rel="stylesheet"
		      type="text/css"
			  href="{{ url_for('static', filename='style.css') }}">
			<link rel="icon" href="{{ url_for('favicon') }}" type="image/vnd.microsoft.icon">
	{% block style %} {% endblock %}

	</head>
	<body>
		<div class="row-div">
			<a href="{{ url_for('index') }}">
				<img class="logo"
					 src="{{ url_for('static', filename='WUR_RGB_standard_2021.png') }}"
					 alt="Wageningen University">
			</a>
			<div class="padded-left" id="genome-title">
				{{ genome }}
			</div>
		</div>

		{% block content %} {% endblock %}

		<div id="empty-space"></div>

		<script>

			// Enable scrolling past the bottom of the page
			function extendScroll() {
				document.getElementById("empty-space").style.height = window.outerHeight / 2 + "px";
			}

			extendScroll();
			window.addEventListener("resize", function() { extendScroll() });

		</script>

		{% block script %} {% endblock %}

	</body>
</html>
