<!DOCTYPE html>
<html>
<head>
	<title> HS -{% block title %} {% endblock %} </title>
	<link href="https://fonts.googleapis.com/css?family=IBM+Plex+Mono&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css') }}">

    <style>
		{% block style %} {% endblock %}
    </style>

</head>
<body>
    <div class="page">
        <div class="header">
            <a href="{{ url_for('index') }}">
                <img src="{{ url_for('static', filename='Wageningen_logo.jpg') }}" alt="Wageningen University" style="max-width: 100%; height: auto;">
            </a>
            <button class="default-button" type="button">Login</button>
        </div>

		<div class="content-container">

			{% block content %}
			{% endblock %}
		</div>
    </div>

	{% block script %} {% endblock %}

</body>
</html>
